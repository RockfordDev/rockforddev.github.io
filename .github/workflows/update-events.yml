name: Sync Events from Eventbrite

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  schedule:
    # Runs every day at 13:00 UTC (7 AM CST / 8 AM CDT)
    - cron: '0 13 * * *'

  # Allow a manual run from the Actions tab at any time
  workflow_dispatch:

# ── Permissions ─────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to commit the updated index.html

# ── Job ─────────────────────────────────────────────────────────────────────
jobs:
  sync-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Python with pip caching for faster subsequent runs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install jinja2

      # 4. Fetch events from Eventbrite and render index.html from the template
      - name: Render index.html from Eventbrite data
        env:
          EVENTBRITE_TOKEN:  ${{ secrets.EVENTBRITE_TOKEN }}
          EVENTBRITE_ORG_ID: ${{ secrets.EVENTBRITE_ORG_ID }}
        run: python .github/scripts/update_events.py

      # 5. Commit and push only when index.html actually changed
      - name: Commit updated index.html (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # 'git diff --staged --quiet' exits 0 when nothing changed → skip commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync events from Eventbrite [skip ci]"
            git push
          fi
